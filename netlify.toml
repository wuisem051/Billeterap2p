# Configuración de Netlify para Panel Usuario / Billetera P2P
# Proyecto: Billeterap2p

[build]
  command = "npm run build"
  publish = "dist"

# Redireccionamiento SPA: todas las rutas van al index.html
# Necesario para que React maneje el enrutamiento del lado del cliente
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguridad HTTP
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.firebaseapp.com https://*.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://firestore.googleapis.com wss://*.firebaseio.com; img-src 'self' data: https:; frame-src 'none';"

# Cache largo para assets estáticos (Vite genera hashes únicos)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sin cache para el HTML principal
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
